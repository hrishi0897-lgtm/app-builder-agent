<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Agent Workspace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    html, body { height: 100%; height: 100dvh; background-color: #0d1117; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .active-tab { border-bottom: 2px solid #58a6ff; color: #58a6ff; }
    .slot-card { transition: all 0.25s ease-out; }
    .slot-card.removing { opacity: 0; transform: scale(0.95); height: 0; margin: 0; padding: 0; overflow: hidden; }
  </style>
</head>
<body class="flex flex-col h-full overflow-hidden">
  <header class="h-12 border-b border-gray-800 flex items-center justify-between px-4 bg-[#161b22] shrink-0">
    <div class="flex items-center space-x-2 font-semibold text-white text-sm">
      <i data-lucide="bot" class="w-5 h-5 text-blue-400"></i>
      <span>Agent Workspace</span>
    </div>
    <div class="flex items-center space-x-2">
      <a href="/api/download-zip" download="project-workspace.zip" class="flex items-center space-x-1 bg-gray-800 hover:bg-gray-700 text-gray-200 border border-gray-700 text-xs px-2.5 py-1 rounded-md">
        <i data-lucide="download" class="w-3.5 h-3.5 text-blue-400"></i>
        <span>ZIP</span>
      </a>
      <div id="statusBadge" class="text-xs px-2.5 py-0.5 rounded-full bg-gray-800 text-gray-400 border border-gray-700">Idle</div>
    </div>
  </header>

  <nav class="flex border-b border-gray-800 bg-[#0d1117] text-sm text-gray-400 shrink-0">
    <button onclick="switchTab('chat')" id="tab-chat" class="flex-1 py-2.5 text-center active-tab">Chat</button>
    <button onclick="switchTab('preview')" id="tab-preview" class="flex-1 py-2.5 text-center">Preview</button>
    <button onclick="switchTab('files')" id="tab-files" class="flex-1 py-2.5 text-center">Files</button>
  </nav>

  <main class="flex-1 overflow-hidden relative flex flex-col">
    <!-- Chat View -->
    <section id="view-chat" class="flex-1 flex flex-col h-full overflow-hidden">
      <div id="messages" class="flex-1 overflow-y-auto p-4 space-y-3">
        <div class="bg-[#161b22] border border-gray-800 p-3 rounded-lg text-sm">
          Welcome! What would you like to build or modify?
        </div>
      </div>

      <!-- Asset Upload Container -->
      <div id="assetSlotsContainer" class="hidden p-3 bg-[#161b22] border-t border-b border-amber-500/30 space-y-2 shrink-0 max-h-56 overflow-y-auto">
        <div class="flex items-center justify-between">
          <div class="flex items-center space-x-2 text-xs font-semibold text-amber-400">
            <i data-lucide="folder-up" class="w-4 h-4"></i>
            <span>Media Required for Accurate Preview</span>
          </div>
          <span id="pendingSlotsCount" class="text-[11px] px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-300 font-mono">0 pending</span>
        </div>
        <div id="slotsList" class="space-y-2"></div>
      </div>

      <!-- Input Bar (Strictly button-triggered submission) -->
      <div class="p-3 border-t border-gray-800 bg-[#161b22] flex items-center space-x-2 shrink-0">
        <textarea id="promptInput" rows="1" placeholder="Type or paste prompt here..." class="flex-1 bg-[#0d1117] border border-gray-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500 resize-none max-h-28"></textarea>
        <button id="sendBtn" type="button" onclick="submitPrompt()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2.5 rounded-lg text-sm font-medium flex items-center space-x-1 shrink-0">
          <span>Send</span>
          <i data-lucide="send" class="w-4 h-4"></i>
        </button>
      </div>
    </section>

    <!-- Preview View -->
    <section id="view-preview" class="flex-1 hidden flex-col h-full overflow-hidden">
      <div class="p-2 border-b border-gray-800 bg-[#161b22] flex justify-end shrink-0">
        <button onclick="reloadPreview()" class="text-xs text-gray-300 border border-gray-700 hover:border-gray-500 px-3 py-1 rounded flex items-center space-x-1">
          <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
          <span>Refresh</span>
        </button>
      </div>
      <iframe id="previewFrame" src="/preview/index.html" class="w-full flex-1 border-none bg-[#0d1117]"></iframe>
    </section>

    <!-- Files View -->
    <section id="view-files" class="flex-1 hidden p-4 overflow-y-auto h-full flex flex-col">
      <div class="flex items-center justify-between mb-3 shrink-0">
        <h3 class="text-xs uppercase tracking-wider text-gray-400 font-semibold">Workspace Files</h3>
        <a href="/api/download-zip" download="project-workspace.zip" class="flex items-center space-x-1.5 bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold px-3 py-1.5 rounded-lg shadow-sm">
          <i data-lucide="download-cloud" class="w-4 h-4"></i>
          <span>Download All (.ZIP)</span>
        </a>
      </div>
      <ul id="filesList" class="space-y-1 text-sm font-mono flex-1 overflow-y-auto"></ul>
    </section>
  </main>

  <script>
    lucide.createIcons();

    function switchTab(tab) {
      ['chat', 'preview', 'files'].forEach(t => {
        document.getElementById(`view-${t}`).classList.add('hidden');
        document.getElementById(`tab-${t}`).classList.remove('active-tab');
      });
      document.getElementById(`view-${tab}`).classList.remove('hidden');
      document.getElementById(`view-${tab}`).classList.add('flex');
      document.getElementById(`tab-${tab}`).classList.add('active-tab');

      if (tab === 'preview') reloadPreview();
      if (tab === 'files') loadFiles();
    }

    function reloadPreview() {
      const frame = document.getElementById('previewFrame');
      frame.src = '/preview/index.html?t=' + Date.now();
    }

    async function loadFiles() {
      const res = await fetch('/api/files');
      const data = await res.json();
      const list = document.getElementById('filesList');
      list.innerHTML = '';
      (data.files || []).forEach(f => {
        const li = document.createElement('li');
        li.className = 'py-1.5 px-2.5 hover:bg-gray-800 rounded text-gray-300 flex items-center space-x-2 bg-[#161b22]/50 border border-gray-800/80 mb-1';
        const isAsset = f.startsWith('assets/');
        li.innerHTML = `
          <i data-lucide="${isAsset ? 'file-image' : 'file-code'}" class="w-4 h-4 text-blue-400 shrink-0"></i>
          <span class="truncate">${f}</span>
        `;
        list.appendChild(li);
      });
      lucide.createIcons();
    }

    async function submitPrompt() {
      const input = document.getElementById('promptInput');
      const prompt = input.value.trim();
      if (!prompt) return;

      input.value = '';
      appendMessage('user', prompt);
      setStatus('Generating...', 'bg-amber-900/60 text-amber-300 border-amber-600');

      try {
        const res = await fetch('/api/build', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt })
        });
        const data = await res.json();

        if (data.error) {
          appendMessage('agent', 'Error: ' + data.error);
        } else {
          appendMessage('agent', `Generated/Updated ${data.files.length} file(s).`);
          if (data.asset_requests && data.asset_requests.length > 0) {
            renderAssetRequests(data.asset_requests);
          } else {
            document.getElementById('assetSlotsContainer').classList.add('hidden');
          }
          reloadPreview();
        }
      } catch (err) {
        appendMessage('agent', 'Request failed: ' + err.message);
      } finally {
        setStatus('Idle', 'bg-gray-800 text-gray-400 border-gray-700');
      }
    }

    function renderAssetRequests(requests) {
      const container = document.getElementById('assetSlotsContainer');
      const list = document.getElementById('slotsList');
      const countBadge = document.getElementById('pendingSlotsCount');
      list.innerHTML = '';

      requests.forEach(req => {
        const isVideo = (req.type || 'photo').toLowerCase() === 'video';
        const acceptType = isVideo ? 'video/*' : 'image/*';
        const badgeColor = isVideo ? 'bg-purple-900/40 text-purple-300 border-purple-700' : 'bg-blue-900/40 text-blue-300 border-blue-700';
        const iconName = isVideo ? 'film' : 'image';

        const div = document.createElement('div');
        div.id = `slot-card-${req.slot}`;
        div.className = 'slot-card flex items-center justify-between bg-[#0d1117] p-2 rounded border border-gray-700 text-xs';
        div.innerHTML = `
          <div class="flex items-start space-x-2 mr-2">
            <div class="p-1.5 rounded border ${badgeColor} mt-0.5">
              <i data-lucide="${iconName}" class="w-3.5 h-3.5"></i>
            </div>
            <div>
              <div class="flex items-center space-x-1.5">
                <span class="font-medium text-white">${req.label || req.slot}</span>
                <span class="text-[10px] uppercase font-mono px-1 py-0.2 rounded border ${badgeColor}">${isVideo ? 'Video' : 'Photo'}</span>
              </div>
              <div class="text-gray-400 text-[11px] leading-tight mt-0.5">${req.description || ''}</div>
            </div>
          </div>
          <label class="cursor-pointer ${isVideo ? 'bg-purple-600 hover:bg-purple-500' : 'bg-blue-600 hover:bg-blue-500'} text-white px-2.5 py-1 rounded text-xs font-semibold shrink-0">
            Upload
            <input type="file" accept="${acceptType}" class="hidden" onchange="uploadSlotMedia('${req.slot}', '${isVideo ? 'video' : 'photo'}', this)">
          </label>
        `;
        list.appendChild(div);
      });

      countBadge.textContent = `${requests.length} pending`;
      container.classList.remove('hidden');
      lucide.createIcons();
    }

    async function compressImageIfNeeded(file) {
      if (!file.type.startsWith('image/')) return file;
      return new Promise((resolve) => {
        const img = new Image();
        img.src = URL.createObjectURL(file);
        img.onload = () => {
          const maxDim = 1200;
          let w = img.width, h = img.height;
          if (w > maxDim || h > maxDim) {
            if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
            else { w = Math.round((w * maxDim) / h); h = maxDim; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          canvas.toBlob((blob) => {
            resolve(blob ? new File([blob], file.name, { type: 'image/png' }) : file);
          }, 'image/png');
        };
        img.onerror = () => resolve(file);
      });
    }

    async function uploadSlotMedia(slot, mediaType, inputElement) {
      if (!inputElement.files || !inputElement.files[0]) return;
      let file = inputElement.files[0];

      setStatus(`Preparing ${slot}...`, 'bg-blue-900/60 text-blue-300 border-blue-600');

      if (mediaType === 'photo') {
        file = await compressImageIfNeeded(file);
      }

      const formData = new FormData();
      formData.append('slot', slot);
      formData.append('type', mediaType);
      formData.append('file', file);

      setStatus(`Uploading ${slot}...`, 'bg-blue-900/60 text-blue-300 border-blue-600');
      try {
        const res = await fetch('/api/upload-asset', { method: 'POST', body: formData });
        const data = await res.json();
        if (data.status === 'success') {
          appendMessage('agent', `✓ Uploaded ${mediaType}: <strong>${slot}</strong>`);
          
          const card = document.getElementById(`slot-card-${slot}`);
          if (card) {
            card.classList.add('removing');
            setTimeout(() => {
              card.remove();
              const remaining = document.querySelectorAll('#slotsList .slot-card').length;
              const countBadge = document.getElementById('pendingSlotsCount');
              if (countBadge) countBadge.textContent = `${remaining} pending`;
              if (remaining === 0) {
                document.getElementById('assetSlotsContainer').classList.add('hidden');
              }
            }, 250);
          }
          reloadPreview();
        } else {
          alert('Upload failed: ' + (data.error || 'Unknown error'));
        }
      } catch (e) {
        alert('Upload error: ' + e.message);
      } finally {
        setStatus('Idle', 'bg-gray-800 text-gray-400 border-gray-700');
      }
    }

    function appendMessage(sender, text) {
      const msgs = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = sender === 'user'
        ? 'bg-blue-950/40 border border-blue-800/60 p-3 rounded-lg text-sm text-blue-100 ml-6'
        : 'bg-[#161b22] border border-gray-800 p-3 rounded-lg text-sm mr-6';
      div.innerHTML = text;
      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
    }

    function setStatus(text, classes) {
      const badge = document.getElementById('statusBadge');
      badge.textContent = text;
      badge.className = `text-xs px-2.5 py-0.5 rounded-full border ${classes}`;
    }
  </script>
</body>
</html>
